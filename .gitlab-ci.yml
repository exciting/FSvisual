image: python:3.11

stages:
  - test

full_test:
  stage: test
  before_script:
    - git clone --recursive https://github.com/cnr-isti-vclab/meshlab.git
    - cd meshlab
    - mkdir build && cd build
    - cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DENABLE_CGAL=ON -DENABLE_OPENMP=ON ..
    - make -j$(nproc)
    - make install

    - apt-get update && apt-get install -y libgl1
    - pip3 install --upgrade pip
    - pip3 install pytest
    - pip3 install .
  script:
    - pytest -vv tests